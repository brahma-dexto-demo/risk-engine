[project]
name = "risk-engine"
version = "0.1.0"
description = "Account churn scoring batch job"
requires-python = ">=3.12,<3.13"
dependencies = ["scikit-learn>=1.6,<2", "joblib>=1.4,<2", "boto3>=1.35,<2"]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
